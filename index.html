<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Aurora – prueba</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ea;color:#222}
#w{max-width:560px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:#fff}
header{padding:14px 16px;background:#1f3a5f;color:#fff}header b{font-size:18px}header small{display:block;opacity:.8}
#log{flex:1;overflow:auto;padding:12px}.m{margin:8px 0;padding:10px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap;line-height:1.4}
.a{background:#eef2f7}.u{background:#c9a227;color:#111;margin-left:auto}
#st{font-size:12px;color:#666;padding:4px 12px}form{display:flex;gap:6px;padding:10px;border-top:1px solid #ddd}
input{flex:1;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:8px}button{padding:10px 14px;font-size:16px;background:#1f3a5f;color:#fff;border:0;border-radius:8px}
footer{font-size:11px;color:#777;padding:6px 12px 10px}</style></head><body><div id="w">
<header><b>Aurora</b><small>Asistente educativa · seguro de vida, gastos finales y última voluntad</small></header>
<div id="log"></div><div id="st">Cargando…</div>
<form id="f"><input id="q" placeholder="Escribe tu pregunta…" autocomplete="off"><button>Enviar</button></form>
<footer>Información educativa general, no es asesoría. Para precios o recomendaciones te conectamos con un agente licenciado. No compartas información médica. Prototipo de prueba.</footer></div>
<script type="module">
import { pipeline, TextStreamer } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5";
import { MODEL_ID, SYSTEM, route, sanitize } from "./bot.js";
const log=document.getElementById("log"), st=document.getElementById("st");
const add=(t,c)=>{const d=document.createElement("div");d.className="m "+c;d.textContent=t;log.appendChild(d);log.scrollTop=1e9;return d};
add("¡Hola! Soy Aurora. Te explico el seguro de vida con beneficios en vida, el seguro de gastos finales y la última voluntad. ¿En qué te ayudo?","a");
const state={step:null,lead:{}}; let gen=null, hist=[];
const pct={};
async function load(){ let gpuOk=false; try{ gpuOk = !!(navigator.gpu && await navigator.gpu.requestAdapter()); }catch(e){}
  for (const dev of (gpuOk ? ["webgpu"] : ["wasm"])) {
  try{ gen = await pipeline("text-generation", MODEL_ID, {dtype:"q4", device:dev, progress_callback:p=>{ if(p.status==="progress"){pct[p.file]=p.progress; const v=Object.values(pct); st.textContent=`Descargando el modelo (solo la primera vez, ~1 GB): ${Math.round(v.reduce((a,b)=>a+b,0)/v.length)}%`;}}});
    st.textContent = "Listo ("+dev+"). Las respuestas abiertas pueden tardar 10–40 s."; return; }
  catch(e){ console.error("load "+dev, e); } }
  st.textContent="No se pudo cargar el modelo en este equipo; solo responderán las preguntas frecuentes."; }
load();
document.getElementById("f").onsubmit=async e=>{e.preventDefault(); const q=document.getElementById("q").value.trim(); if(!q) return; document.getElementById("q").value=""; add(q,"u");
  const r=route(q,state); if(r){add(r,"a");return;}
  if(!gen){add("Todavía estoy preparándome. Mientras tanto, pregúntame por beneficios en vida, hipoteca, gastos finales o la última voluntad.","a");return;}
  const d=add("…","a"); let txt="";
  const msgs=[{role:"system",content:SYSTEM},...hist.slice(-4),{role:"user",content:q}];
  const streamer=new TextStreamer(gen.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>{txt+=t;d.textContent=sanitize(txt);log.scrollTop=1e9;}});
  const out=await gen(msgs,{max_new_tokens:200,do_sample:false,repetition_penalty:1.1,streamer});
  const fin=sanitize(out[0].generated_text.at(-1).content); d.textContent=fin; hist.push({role:"user",content:q},{role:"assistant",content:fin}); };
</script></body></html>
